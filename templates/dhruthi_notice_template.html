<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dhruthi Wellness - Official Notice Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #EEF6F1;
      --bg-bot: #C3DECE;
      --card-bg: #FFFFFF;
      --card-fold: #DEECE4;
      --forest-green: #1C352D;
      --sage-muted: #374D43;
      --box-bg: #F4F9F5;
      --box-border: #CDE1D5;
      --mint-pill: #EEF6F1;
      --gold-accent: #D4AF37;
      --gold-light: #F7E9B8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%);
      font-family: 'Outfit', sans-serif;
      padding: 30px 15px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient background glowing circles */
    body::before {
      content: '';
      position: absolute;
      width: 550px;
      height: 550px;
      top: -120px;
      left: -120px;
      background: rgba(255, 255, 255, 0.45);
      border-radius: 50%;
      filter: blur(65px);
      z-index: 0;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      width: 650px;
      height: 650px;
      bottom: -150px;
      right: -150px;
      background: rgba(130, 185, 160, 0.35);
      border-radius: 50%;
      filter: blur(75px);
      z-index: 0;
      pointer-events: none;
    }

    .wrapper {
      position: relative;
      width: 100%;
      max-width: 860px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      z-index: 1;
    }

    /* Main Card (Top-right overlapping badge design) */
    .card {
      position: relative;
      width: 82%;
      background: var(--card-bg);
      border-radius: 28px;
      box-shadow: 
        0 22px 45px -10px rgba(15, 40, 30, 0.2),
        0 8px 18px -4px rgba(15, 40, 30, 0.1);
      padding: 42px 48px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      overflow: hidden;
    }

    /* Folded Corner */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 75px 75px 0;
      border-color: transparent var(--card-fold) transparent transparent;
      filter: drop-shadow(-3px 3px 4px rgba(0,0,0,0.08));
    }

    /* Gold accent bar top left */
    .gold-accent-bar {
      width: 130px;
      height: 5px;
      background: linear-gradient(90deg, var(--gold-accent), #E5C158);
      border-radius: 3px;
      margin-bottom: 10px;
    }

    /* Circular Dhruthi Logo Badge (Overlapping top-right corner) */
    .logo-badge {
      position: absolute;
      top: 45px;
      right: -25px;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: #FFFFFF;
      padding: 4px;
      box-shadow: 0 14px 32px rgba(15, 40, 30, 0.22);
      border: 3px solid var(--gold-accent);
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .logo-badge img {
      width: 88%;
      height: 88%;
      object-fit: contain;
      border-radius: 50%;
    }

    /* Section A: Greeting */
    .greeting-pill {
      display: inline-flex;
      align-items: center;
      background: var(--mint-pill);
      padding: 10px 26px;
      border-radius: 16px;
      width: fit-content;
      margin-bottom: 5px;
    }

    .greeting-pill h2 {
      font-family: 'Lora', serif;
      font-size: 2.0rem;
      font-weight: 700;
      color: var(--forest-green);
    }

    /* Section B: Message Box (Sized so it clears the logo badge) */
    .message-box {
      background: var(--box-bg);
      border: 2px solid var(--box-border);
      border-radius: 22px;
      padding: 28px 34px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 78%;
    }

    .message-box::before {
      content: '';
      position: absolute;
      left: 5px;
      top: 14px;
      bottom: 14px;
      width: 7px;
      background: var(--forest-green);
      border-radius: 4px;
    }

    .message-line {
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--sage-muted);
      line-height: 1.35;
    }

    .email-highlight-container {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .email-badge {
      display: inline-block;
      background: #E1EEE6;
      padding: 4px 14px;
      border-radius: 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--forest-green);
      border-bottom: 3px solid var(--gold-accent);
      letter-spacing: -0.2px;
    }

    /* Section C: Thanks & Operations */
    .thanks-box {
      background: var(--mint-pill);
      border: 1px solid var(--box-border);
      border-radius: 22px;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 78%;
    }

    .thanks-text {
      font-size: 1.35rem;
      font-weight: 400;
      color: var(--sage-muted);
    }

    .team-text {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--forest-green);
    }

    .card-slogan {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--gold-accent);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 6px;
    }

    /* 3D Decorative Envelope in bottom right */
    .envelope-3d {
      position: absolute;
      bottom: -15px;
      right: 0;
      width: 330px;
      height: 220px;
      z-index: 2;
    }

    .envelope-body {
      width: 100%;
      height: 100%;
      background: #284B3C;
      border-radius: 20px;
      position: relative;
      box-shadow: 0 18px 38px rgba(15, 38, 28, 0.32);
      overflow: hidden;
    }

    .flap-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 110px 165px 0 165px;
      border-color: #3C6955 transparent transparent transparent;
      z-index: 4;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
    }

    .flap-top::after {
      content: '';
      position: absolute;
      top: -110px;
      left: -165px;
      width: 330px;
      height: 3.5px;
      background: var(--gold-accent);
    }

    .wax-seal {
      position: absolute;
      top: 90px;
      left: 142px;
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, #D4AF37, #B89028);
      border-radius: 50%;
      z-index: 6;
      box-shadow: 0 4px 8px rgba(0,0,0,0.25);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1C352D;
      font-size: 18px;
    }

    @media print {
      body {
        background: none;
        padding: 0;
      }
      .wrapper {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- Main Notice Card -->
    <div class="card">
      <div class="gold-accent-bar"></div>

      <!-- Section A: Greeting -->
      <div class="greeting-pill">
        <h2>Hello Client,</h2>
      </div>

      <!-- Section B: Message Container -->
      <div class="message-box">
        <div class="message-line">For any concerns, please</div>
        <div class="message-line">reach out exclusively</div>
        <div class="email-highlight-container message-line">
          <span>to</span>
          <span class="email-badge">dhruthiwellness@gmail.com</span>
        </div>
      </div>

      <!-- Section C: Sign-off & Slogan -->
      <div class="thanks-box">
        <div class="thanks-text">Thanks,</div>
        <div class="team-text">Dhruthi Wellness Team</div>
        <div class="card-slogan">Nourish &bull; Balance &bull; Thrive</div>
      </div>
    </div>

    <!-- Circular Logo Badge overlapping card top-right -->
    <div class="logo-badge">
      <img src="Images/Logo_D.png" alt="Dhruthi Wellness Logo">
    </div>

    <!-- 3D Envelope decorative element -->
    <div class="envelope-3d">
      <div class="envelope-body">
        <div class="flap-top"></div>
        <div class="wax-seal">🌿</div>
      </div>
    </div>
  </div>

</body>
</html>
